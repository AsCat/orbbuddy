name: Feature request
description: Propose a development-testing capability
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: "Describe the task and the device/platform where it happens."
    validations:
      required: true
  - type: textarea
    id: proposed_behavior
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: boundaries
    attributes:
      label: Permission and platform boundaries
      description: "State any phone-side approval, Android/iOS restriction, or sensitive action involved."
