name: Bug report
description: Report a reproducible Android, relay, or MCP problem
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Remove tokens, pairing codes, screenshots, typed text, and other private data before submitting. Report security issues privately through SECURITY.md."
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [Android, Go relay, Browser viewer, MCP integration, Deployment, Documentation]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "APK version and server commit/tag"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: "Android version and manufacturer, network type, server OS, and MCP client if relevant."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result and sanitized logs
    validations:
      required: true
