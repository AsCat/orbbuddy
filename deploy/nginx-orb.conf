server {
    listen 80;
    listen [::]:80;
    server_name orb.yuanxuyinli.com;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/yuanxu/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name orb.yuanxuyinli.com;

    ssl_certificate /data/yuanxu/certs/orb.yuanxuyinli.com/fullchain.pem;
    ssl_certificate_key /data/yuanxu/certs/orb.yuanxuyinli.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    client_max_body_size 8m;

    location = /healthz {
        proxy_pass http://127.0.0.1:18093/healthz;
        access_log off;
    }

    location = / {
        proxy_pass http://127.0.0.1:18093/;
    }

    location = /openapi.json {
        proxy_pass http://127.0.0.1:18093/openapi.json;
    }

    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:18093;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 30s;
    }

    location ^~ /share/ {
        proxy_pass http://127.0.0.1:18093;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        access_log off;
    }

    location = /device {
        proxy_pass http://127.0.0.1:18093/device;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /mcp {
        proxy_pass http://127.0.0.1:18093/mcp;
        proxy_http_version 1.1;
        # The MCP SDK keeps localhost Host protection enabled behind this proxy.
        proxy_set_header Host 127.0.0.1;
        proxy_read_timeout 30s;
    }

    location / { return 404; }
}
