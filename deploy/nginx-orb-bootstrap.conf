# Temporary HTTP-only host for the first ACME webroot validation.
server {
    listen 80;
    listen [::]:80;
    server_name orb.yuanxuyinli.com;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/yuanxu/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 404; }
}
